# Swiss population grid – static web app behind a shared-password login.
# Installed as /etc/nginx/snippets/swiss-population-grid.conf and included in the port-80 default
# server (/etc/nginx/conf.d/default.conf), so it answers on http://<server IP>/swiss-population-grid/.
# $spg_authed and the spg_guess zone are defined in /etc/nginx/conf.d/swiss-population-grid.conf.

location = /swiss-population-grid { return 301 /swiss-population-grid/; }

location = /swiss-population-grid/login {
    default_type text/html;
    alias /var/www/swiss-population-grid-login/index.html;
    add_header Cache-Control "no-store";
}

location /swiss-population-grid/ {
    # Phase order matters: limit_req (preaccess) must see a request before the cookie check
    # rejects it, so the check is an auth_request (access phase) rather than an if/return.
    # Only requests without a valid cookie are counted (password guessing).
    limit_req zone=spg_guess burst=20 nodelay;
    limit_req_status 429;
    auth_request /swiss-population-grid-auth;
    error_page 401 = @spg_login;

    alias /var/www/swiss-population-grid/web/;
    index index.html;
    add_header Cache-Control "no-cache";  # revalidate, so a git pull shows up immediately
    gzip_types text/css application/javascript text/javascript application/json;
}

location = /swiss-population-grid-auth {
    internal;
    if ($spg_authed = 0) { return 401; }
    return 204;
}

location @spg_login { return 302 /swiss-population-grid/login; }

# Caching proxy for swisstopo (basemap styles/tiles, terrain, search, commune lookup), used by
# web/remote.js. A copy is kept for a week, then refreshed in the background; while swisstopo is
# unreachable, throttles (429) or refuses (403/5xx) the cached copy is served instead. Behind the
# same login, so it is not an open proxy; the cache zone spg_geo is defined in conf.d.
location = /swiss-population-grid/geo/health { return 204; }

location ~ ^/swiss-population-grid/geo/(vectortiles|wmts|3d|api3)\.geo\.admin\.ch/(.*)$ {
    limit_req zone=spg_guess burst=20 nodelay;
    limit_req_status 429;
    auth_request /swiss-population-grid-auth;
    error_page 401 = @spg_login;

    set $spg_upstream $1.geo.admin.ch;
    set $spg_path $2;
    resolver 127.0.0.53 ipv6=off valid=300s;
    proxy_pass https://$spg_upstream/$spg_path$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $spg_upstream;
    proxy_set_header Cookie "";          # never forward our login cookie
    proxy_set_header Accept-Encoding gzip;
    proxy_ssl_server_name on;
    proxy_ssl_name $spg_upstream;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;

    proxy_cache spg_geo;
    proxy_cache_key $spg_upstream/$spg_path$is_args$args;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_hide_header Set-Cookie;
    proxy_hide_header X-Cache;           # swisstopo's CDN status; ours (HIT/MISS/STALE…) is added below
    proxy_hide_header Cache-Control;     # swisstopo's own lifetimes (and the age of its CDN copy) would
    proxy_hide_header Expires;           # make browsers re-request tiles we have; ours is added below
    proxy_hide_header Age;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 403 404 1d;        # swisstopo's terrain answers 403 for tiles it doesn't have
    proxy_cache_use_stale error timeout invalid_header updating http_403 http_429 http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;
    add_header Cache-Control "public, max-age=86400";  # not "always": errors must not stick in browsers
}
