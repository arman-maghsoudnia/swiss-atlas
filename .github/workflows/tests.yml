# Runs the test suites in tests/: the browser modules and the committed data with Node's built-in
# test runner, and serve.py and the build scripts with Python's unittest. No dependencies to install.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JavaScript (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs

  browser:
    name: Browser smoke test (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # ubuntu-latest ships Google Chrome; the test blocks geo.admin.ch, so it needs no network access.
      - run: node --test tests/e2e.test.mjs
        env:
          SPG_E2E: "1"
          CHROME: /usr/bin/google-chrome

  python:
    name: Python (unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p "test_*.py" -v
